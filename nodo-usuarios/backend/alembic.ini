# Configuración de Alembic (migraciones de la base de datos).
# Ejecuta los comandos desde backend/: `.venv/bin/alembic upgrade head`,
# o desde la raíz del proyecto con `npm run db:upgrade` y `npm run db:revision -- "mensaje"`.
# La URL de la base de datos NO va aquí: migrations/env.py la lee de backend/.env (DATABASE_URL).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Nombre de los archivos de migración: fecha, revisión y mensaje.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
