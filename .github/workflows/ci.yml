# Comprobaciones de cada push a main y de cada pull request:
# lint, pruebas y build del front-end, y pruebas del backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nodo-usuarios

jobs:
  frontend:
    name: Front-end (lint, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodo-usuarios/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm audit

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # Las pruebas se ejecutan contra PostgreSQL, igual que en local y en producción.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nodo
          POSTGRES_PASSWORD: nodo
          POSTGRES_DB: nodo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodo -d nodo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nodo:nodo@127.0.0.1:5432/nodo_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            nodo-usuarios/backend/requirements.txt
            nodo-usuarios/backend/requirements-dev.txt
      # El mismo entorno que en local: `npm run test:api` usa backend/.venv.
      # Las pruebas definen sus propias variables de entorno (tests/conftest.py); no hace falta .env.
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm run test:api
      - run: backend/.venv/bin/pip-audit -r backend/requirements.txt
